<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOVE & HATE | CORTE DE CAJA</title>
  <link rel="stylesheet" href="style.css">
  <!-- Librería jsPDF para generar el PDF directamente en el navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  
  <!-- Menú Lateral -->
  <aside class="sidebar" id="sidebar">
    <button class="close-btn" id="closeMenu">✕</button>
    <div class="sidebar-top">
      <div class="logo">
        <h1 class="red-text">LOVE & HATE</h1>
        <h2>POS & STOCK</h2>
      </div>
      <nav class="menu" style="margin-top: 40px;">
        <a href="pos.html" class="menu-btn" style="text-decoration: none; display: block;">POS</a>
        <a href="admin.html" class="menu-btn" style="text-decoration: none; display: block;">Stock</a>
        <a href="corte.html" class="menu-btn active" style="text-decoration: none; display: block;">Corte</a>
      </nav>
    </div>
    <div class="sidebar-bottom">
      <div class="admin-user">
        <p>👤 MIGUEL NEG</p>
        <p class="red-text italic">Admin View</p>
      </div>
      <div class="admin-actions">
        <a href="index.html" class="action-link">⟵ Menu View</a>
        <button class="action-link log-off">Log Off</button>
      </div>
    </div>
  </aside>

  <!-- Contenedor Principal -->
  <div class="app-container">
    <main class="main-content" style="padding: 30px; overflow-y: auto;">
      
      <header class="top-bar" style="margin-bottom: 30px;">
        <button class="hamburger-btn" id="openMenu">☰</button>
        <h2 style="color: #fff; margin: 0;">CORTE DE CAJA DIARIO</h2>
      </header>

      <!-- Tarjetas de Resumen -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px;">
        <div style="background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333;">
          <p style="color: #888; margin: 0; font-size: 12px;">INGRESOS TOTALES</p>
          <h3 id="lblIngresosTotales" style="color: #37ff8e; font-size: 28px; margin: 5px 0 0 0;">$0 MXN</h3>
        </div>
        <div style="background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333;">
          <p style="color: #888; margin: 0; font-size: 12px;">ARTÍCULOS VENDIDOS</p>
          <h3 id="lblArticulosVendidos" style="color: #fff; font-size: 28px; margin: 5px 0 0 0;">0</h3>
        </div>
      </div>

      <!-- Tabla de Desglose -->
      <div style="background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; margin-bottom: 30px;">
        <h3 style="color: #fff; margin-top: 0; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 10px;">Desglose de Artículos Vendidos Hoy</h3>
        <div id="tablaDesglose" style="margin-top: 15px;">
          <p style="color: #888; text-align: center;">No hay ventas registradas en esta sesión.</p>
        </div>
      </div>

      <!-- Botón de Descarga PDF -->
      <button id="btnDescargarPDF" class="checkout-btn" style="background: #37ff8e; color: #000; font-weight: bold; padding: 15px 30px; border: none; border-radius: 4px; cursor: pointer;">
        📄 DESCARGAR CORTE EN PDF
      </button>

      <button id="btnCerrarTurno" style="background: #ff3333; color: #fff; font-weight: bold; padding: 15px 30px; border: none; border-radius: 4px; cursor: pointer; margin-top: 15px; display: block; width: 100%;">
        🔒 CERRAR TURNO Y LOG OFF
    </button>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
