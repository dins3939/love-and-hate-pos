<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVE & HATE | MENU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Menú Lateral Oculto -->
  <aside class="sidebar" id="sidebar">
    <button class="close-btn" id="closeMenu">✕</button>
    
    <div class="sidebar-top">
      <div class="logo">
        <h1 class="red-text">LOVE & HATE</h1>
        <h2>POS & STOCK</h2>
      </div>
    </div>

    <div class="sidebar-bottom">
      <div class="admin-user" id="auth-panel">
        <a href="login.html" id="btnSidebarLogin" style="color: white; text-decoration: none;">👤 LOGIN</a>
        <p class="red-text italic">Menu View</p>
      </div>
      <div class="admin-actions" id="admin-links" style="display: none;">
        <a href="admin.html" class="action-link">Entrar a POS ⟶</a>
      </div>
    </div>
  </aside>

  <!-- Área Principal -->
  <main class="main-content">
    <!-- Barra superior -->
    <header class="top-bar">
      <button class="hamburger-btn" id="openMenu">☰</button>
      <input type="text" class="search-input" placeholder="🔍 SEARCH" autofocus>
    </header>

    <!-- Filtros rápidos deslizables (Actualizados al nuevo motor) -->
    <nav class="public-filters" style="display: flex; gap: 10px; margin-bottom: 20px;">
      <button class="filter-btn active" onclick="cambiarFiltro('All', this)">All</button>
      <button class="filter-btn" onclick="cambiarFiltro('CD\'s', this)">CD's</button>
      <button class="filter-btn" onclick="cambiarFiltro('Vinyl', this)">Viniles</button>
      <button class="filter-btn" onclick="cambiarFiltro('Shirt', this)">Playeras</button>
    </nav>

    <!-- La Cuadrícula de Discos -->
    <section class="catalog-grid">
    </section>

    <!-- NUEVO: CONTENEDOR PARA LOS NÚMEROS DE PÁGINA -->
    <div id="paginacion" style="display: flex; justify-content: center; gap: 10px; margin-top: 30px; margin-bottom: 40px;"></div>
    
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>   
</body>
</html>
